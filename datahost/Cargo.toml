[package]
name = "inilla-datahost"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "iNilla: serve your own 1.12.1 client's Data folder to your own devices — a manifest of the archives with SHA-256 hashes, and the files with Range support for resumable downloads"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
