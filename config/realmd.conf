# realmd overrides — applied on every start over vmangos' own defaults (realmd.conf.dist).
#
# One `Key = Value` per line; string values keep their quotes. The full list of keys is vmangos'
# src/realmd/realmd.conf.dist.in (or `docker compose exec realmd cat /opt/vmangos/etc/realmd.conf.dist`).
# Restart to apply: `docker compose restart realmd`.
#
# The stack sets LoginDatabaseInfo, LogsDir, BindIP and RealmServerPort itself.

# Wrong passwords before an IP is throttled (vmangos default shown):
# WrongPass.MaxAttempts = 10
