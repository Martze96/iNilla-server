# mangosd overrides — applied on every start over vmangos' own defaults (mangosd.conf.dist).
#
# One `Key = Value` per line; string values keep their quotes. The full list of keys, with
# explanations, is vmangos' src/mangosd/mangosd.conf.dist.in (or `docker compose exec mangosd
# cat /opt/vmangos/etc/mangosd.conf.dist`). Restart to apply: `docker compose restart mangosd`.
#
# The stack sets these itself, so do not put them here: the four *Database.Info strings, DataDir,
# LogsDir, HonorDir, BindIP, WorldServerPort, RealmID, Console.Enable, GameType (REALM_TYPE in .env),
# Warden.* (off: the iNilla client has no Warden) and vmap/mmap switches (on when extracted).

Motd = "Welcome to iNilla."

# ---- a few common ones (vmangos defaults shown) -------------------------------------------------
# Content patch: 10 = 1.12, the whole of vanilla. Lower it for progression (0 = 1.2 … 9 = 1.11).
# WowPatch = 10
