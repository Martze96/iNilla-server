# Rate.XP.Quest = 1
# Rate.XP.Explore = 1
# Rate.Rest.InGame = 1
# Rate.Drop.Money = 1
# Rate.Drop.Item.Normal = 1
# Rate.Reputation.Gain = 1
# StartPlayerLevel = 1
# StartPlayerMoney = 0
# MaxPlayerLevel = 60
# SkipCinematics = 0
